[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-docx>=1.1",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["caseclerk_core", "caseclerk_pipeline", "caseclerk_artifacts"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
no_implicit_reexport = false
mypy_path = "packages/caseclerk-core/src:packages/caseclerk-pipeline/src:packages/caseclerk-artifacts/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "mammoth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfminer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx.*"
ignore_missing_imports = true
