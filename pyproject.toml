[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
caseclerk-core = { workspace = true }
caseclerk-pipeline = { workspace = true }
caseclerk-fixtures = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    "mcp>=2.0",
    "pyinstaller>=6.10",
    # caseclerk-fixtures' own tests exercise the real stage-1 extractors against the
    # generated docs; caseclerk-fixtures itself has no runtime dependency on either.
    "caseclerk-pipeline",
    # caseclerk-cli's tests build a real fixture drive to drive init/process/status/retry
    # against; caseclerk-cli has no runtime dependency on caseclerk-fixtures.
    "caseclerk-fixtures",
]

[tool.pytest.ini_options]
# picked up only when pytest is invoked with cwd == repo root (each package's own
# pyproject.toml [tool.pytest.ini_options] takes precedence for a per-package run);
# keeps `uv run pytest` from root fast by default while `-m e2e tests/e2e` opts in.
addopts = "-m 'not e2e'"
markers = [
    "e2e: full end-to-end test that spawns the real `caseclerk serve` over stdio (slow; run with `-m e2e`)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = [
    "caseclerk_core",
    "caseclerk_pipeline",
    "caseclerk_artifacts",
    "caseclerk_mcp",
    "caseclerk_cli",
    "caseclerk_fixtures",
    "caseclerk_tray",
    "caseclerk_clio_export",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = true
no_implicit_reexport = false
mypy_path = "packages/caseclerk-core/src:packages/caseclerk-pipeline/src:packages/caseclerk-artifacts/src:packages/caseclerk-mcp/src:packages/caseclerk-cli/src:packages/caseclerk-fixtures/src:packages/caseclerk-tray/src:packages/caseclerk-clio-export/src"
explicit_package_bases = true
# Every package's tests/ is its own root (no __init__.py, by design -- see the stage-1
# scaffold commit), so two packages both naming a fixture file "conftest.py" compute the
# same top-level module name and mypy refuses to check either ("Duplicate module named
# conftest"). conftest.py content here is simple pytest wiring; excluding it from the
# unified sweep is the standard workaround for this mypy limitation in a multi-package repo.
exclude = ["/tests/conftest\\.py$"]

[[tool.mypy.overrides]]
module = "mammoth.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfminer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "docx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pystray.*"
ignore_missing_imports = true
