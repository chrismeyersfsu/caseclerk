name: e2e

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tests/e2e/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "packages/**"
      - "tests/e2e/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/e2e.yml"
  # lets release.yml reuse this exact job instead of duplicating it
  workflow_call: {}
  # `gh workflow run e2e.yml` on demand -- useful for confirming a fix (or a
  # suspected flake) on all three OSes without needing a throwaway push.
  # Added while chasing the windows-latest sqlite3.OperationalError flake
  # fixed by db.py's connect() retry; kept since it's a harmless, standard
  # capability to have, not removed after that investigation closed.
  workflow_dispatch: {}

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run e2e happy path
        run: uv run pytest -m e2e tests/e2e

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: test-artifacts/e2e/
          if-no-files-found: warn
