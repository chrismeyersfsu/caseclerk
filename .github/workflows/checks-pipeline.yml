name: checks-pipeline

on:
  push:
    branches: [main]
    paths:
      - "packages/caseclerk-pipeline/**"
      - "packages/caseclerk-core/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/_checks.yml"
      - ".github/workflows/checks-pipeline.yml"
  pull_request:
    paths:
      - "packages/caseclerk-pipeline/**"
      - "packages/caseclerk-core/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/_checks.yml"
      - ".github/workflows/checks-pipeline.yml"

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-pipeline
