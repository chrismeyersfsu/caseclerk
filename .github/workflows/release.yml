name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify-core:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-core

  verify-pipeline:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-pipeline

  verify-artifacts:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-artifacts

  verify-mcp:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-mcp

  verify-cli:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-cli

  verify-fixtures:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-fixtures

  verify-tray:
    uses: ./.github/workflows/_checks.yml
    with:
      package: caseclerk-tray

  verify-e2e:
    uses: ./.github/workflows/e2e.yml

  package-windows:
    needs:
      - verify-core
      - verify-pipeline
      - verify-artifacts
      - verify-mcp
      - verify-cli
      - verify-tray
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build Windows package
        run: uv run python scripts/build_windows.py --dist-dir dist-windows

      - name: Smoke test -- caseclerk.exe --version
        run: |
          $version = & "dist-windows\caseclerk\caseclerk.exe" --version
          Write-Host "version output: $version"
          if ($LASTEXITCODE -ne 0) { throw "caseclerk.exe --version exited $LASTEXITCODE" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "unexpected --version output: $version" }

      - name: Smoke test -- caseclerk.exe doctor
        run: |
          $env:CASECLERK_CONFIG_DIR = "$PWD\smoke-config"
          $env:CASECLERK_DATA_DIR = "$PWD\smoke-data"
          $doctorOutput = & "dist-windows\caseclerk\caseclerk.exe" doctor 2>&1 | Out-String
          Write-Host $doctorOutput
          # exit code 1 is expected here (no documentsRoot in a fresh smoke-test env);
          # what this proves is that the frozen build actually starts and runs a real
          # command end to end, not that every check passes. GitHub Actions' pwsh
          # step wrapper fails the step if $LASTEXITCODE is nonzero when the script
          # ends, regardless of whether our own checks below threw -- doctor's
          # expected exit 1 would otherwise fail this step for the "right" reason.
          if ($doctorOutput -notmatch "running as a packaged binary") {
            throw "doctor did not report packaged-binary status:`n$doctorOutput"
          }
          if ($doctorOutput -match "Traceback") {
            throw "doctor crashed:`n$doctorOutput"
          }
          $global:LASTEXITCODE = 0

      - name: Smoke test -- caseclerk-tray.exe --smoke
        run: |
          $env:CASECLERK_CONFIG_DIR = "$PWD\smoke-config-tray"
          $env:CASECLERK_DATA_DIR = "$PWD\smoke-data-tray"
          $output = & "dist-windows\caseclerk\caseclerk-tray.exe" --smoke 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "caseclerk-tray.exe --smoke exited $LASTEXITCODE`n$output" }
          if ($output -notmatch "^caseclerk-tray ") { throw "unexpected --smoke output:`n$output" }
          if ($output -match "Traceback") { throw "caseclerk-tray.exe --smoke crashed:`n$output" }

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: caseclerk-windows-x64
          path: dist-windows/caseclerk-windows-x64.zip
          if-no-files-found: error

      - name: Compile installer (Inno Setup)
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccCmd) {
            $iscc = $isccCmd.Source
          } else {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found (tried PATH and $iscc)" }
          Write-Host "Using ISCC: $iscc"

          & $iscc "/DMyAppVersion=$version" scripts\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit $LASTEXITCODE" }

          $setupPath = "dist-installer\CaseClerk-Setup-$version.exe"
          if (-not (Test-Path $setupPath)) { throw "expected installer not found at $setupPath" }
          Write-Host "Built $setupPath"

      - name: Smoke test -- silent install
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $setupPath = (Resolve-Path "dist-installer\CaseClerk-Setup-$version.exe").Path
          $installDir = Join-Path $PWD "smoke-install"

          # /TASKS="autostart" selects the (unchecked-by-default) "start
          # automatically" task explicitly, so this run also exercises the
          # HKCU Run key write path, not just its removal on uninstall below.
          $proc = Start-Process -FilePath $setupPath -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`"", "/TASKS=`"autostart`""
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "silent install failed with exit $($proc.ExitCode)" }

          $exePath = Join-Path $installDir "caseclerk.exe"
          if (-not (Test-Path $exePath)) { throw "caseclerk.exe not found at $exePath after silent install" }

          $installedVersion = & $exePath --version
          Write-Host "installed version: $installedVersion"
          if ($LASTEXITCODE -ne 0) { throw "installed caseclerk.exe --version exited $LASTEXITCODE" }
          if ($installedVersion -ne $version) {
            throw "installed version ($installedVersion) does not match tag version ($version)"
          }

          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*$installDir*") {
            throw "install dir was not added to the user PATH registry value"
          }
          Write-Host "PATH updated correctly: $installDir is present"

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name "CaseClerk" -ErrorAction SilentlyContinue).CaseClerk
          if (-not $runValue) { throw "HKCU Run value 'CaseClerk' was not written by the autostart task" }
          if ($runValue -notlike "*caseclerk-tray.exe*") { throw "unexpected autostart Run value: $runValue" }
          Write-Host "Autostart Run value written correctly: $runValue"

      - name: Smoke test -- caseclerk-tray.exe --smoke (installed)
        run: |
          $installDir = Join-Path $PWD "smoke-install"
          $exePath = Join-Path $installDir "caseclerk-tray.exe"
          if (-not (Test-Path $exePath)) { throw "caseclerk-tray.exe not found at $exePath after silent install" }

          $env:CASECLERK_CONFIG_DIR = "$PWD\smoke-config-tray-installed"
          $env:CASECLERK_DATA_DIR = "$PWD\smoke-data-tray-installed"
          $output = & $exePath --smoke 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "installed caseclerk-tray.exe --smoke exited $LASTEXITCODE`n$output" }
          if ($output -notmatch "^caseclerk-tray ") { throw "unexpected --smoke output:`n$output" }

      - name: Smoke test -- reinstalling over a running caseclerk.exe is handled cleanly
        run: |
          # Regression coverage for a real failure report: installing over a
          # running `caseclerk.exe serve` (sharing was on) silently kept the
          # OLD binaries in place -- Setup "succeeded" but --version still
          # reported the old build, because the running process still had
          # the file open. This starts a real, long-running server process
          # from the already-installed copy, reinstalls over it while it's
          # running, and asserts the installer terminated that process
          # (Restart Manager and/or the PrepareToInstall taskkill backstop --
          # see scripts/installer.iss) rather than leaving it locking files.
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $setupPath = (Resolve-Path "dist-installer\CaseClerk-Setup-$version.exe").Path
          $installDir = Join-Path $PWD "smoke-install"
          $exePath = Join-Path $installDir "caseclerk.exe"

          $env:CASECLERK_CONFIG_DIR = "$PWD\smoke-config-reinstall"
          $env:CASECLERK_DATA_DIR = "$PWD\smoke-data-reinstall"

          # 127.0.0.1-only (serve_http never binds anything else), so this
          # never triggers a Windows Firewall "allow this app" prompt, which
          # would otherwise hang an unattended run.
          $serverProc = Start-Process -FilePath $exePath -ArgumentList @(
            "serve", "--transport", "http", "--port", "18787"
          ) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if ($serverProc.HasExited) {
            throw "caseclerk.exe serve exited early (exit $($serverProc.ExitCode)); can't test the running-process case"
          }
          $serverPid = $serverProc.Id
          Write-Host "Started caseclerk.exe serve (pid $serverPid) to reinstall over"

          $proc = Start-Process -FilePath $setupPath -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installDir`""
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
            throw "reinstall over a running process failed with exit $($proc.ExitCode)"
          }

          Start-Sleep -Seconds 2
          $stillRunning = Get-Process -Id $serverPid -ErrorAction SilentlyContinue
          if ($stillRunning) {
            Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
            throw "caseclerk.exe serve (pid $serverPid) was still running after reinstall -- installer did not terminate it"
          }
          Write-Host "Confirmed: the running caseclerk.exe process was terminated by the installer"

          # And the reinstall itself must have actually succeeded -- not
          # silently left the old (locked) binary in place.
          $reinstalledVersion = & $exePath --version
          if ($LASTEXITCODE -ne 0) { throw "caseclerk.exe --version exited $LASTEXITCODE after reinstall" }
          if ($reinstalledVersion -ne $version) {
            throw "reinstalled version ($reinstalledVersion) does not match tag version ($version)"
          }
          Write-Host "Confirmed: reinstall succeeded ($reinstalledVersion)"

      - name: Smoke test -- silent uninstall
        run: |
          $installDir = Join-Path $PWD "smoke-install"
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            Write-Host "::warning::uninstaller not found at $uninstaller, skipping uninstall smoke test"
            exit 0
          }

          $proc = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "silent uninstall failed with exit $($proc.ExitCode)" }

          # Inno Setup's uninstaller finishes removing files via a brief
          # detached helper process (it can't delete itself while running);
          # give that a moment before checking.
          Start-Sleep -Seconds 3

          $exePath = Join-Path $installDir "caseclerk.exe"
          if (Test-Path $exePath) { throw "caseclerk.exe still present after silent uninstall" }

          $trayExePath = Join-Path $installDir "caseclerk-tray.exe"
          if (Test-Path $trayExePath) { throw "caseclerk-tray.exe still present after silent uninstall" }

          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -like "*$installDir*") {
            throw "install dir still present in the user PATH registry value after uninstall"
          }

          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $runValue = (Get-ItemProperty -Path $runKey -Name "CaseClerk" -ErrorAction SilentlyContinue).CaseClerk
          if ($runValue) {
            throw "HKCU Run value 'CaseClerk' still present after silent uninstall: $runValue"
          }

          Write-Host "Silent uninstall verified: files removed, PATH cleaned up, autostart Run value removed"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: caseclerk-windows-installer
          path: dist-installer/CaseClerk-Setup-*.exe
          if-no-files-found: error

  publish:
    needs:
      - verify-core
      - verify-pipeline
      - verify-artifacts
      - verify-mcp
      - verify-cli
      - verify-fixtures
      - verify-tray
      - verify-e2e
      - package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build wheels + sdists
        run: uv build --all-packages

      - name: Download the ubuntu e2e report
        uses: actions/download-artifact@v4
        with:
          name: e2e-report-ubuntu-latest
          path: e2e-report

      - name: Zip the e2e report
        run: zip -r e2e-report.zip e2e-report

      - name: Download the Windows package
        uses: actions/download-artifact@v4
        with:
          name: caseclerk-windows-x64
          path: windows-package

      - name: Download the Windows installer
        uses: actions/download-artifact@v4
        with:
          name: caseclerk-windows-installer
          path: windows-installer

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* e2e-report.zip windows-package/*.zip windows-installer/*.exe \
            --generate-notes
