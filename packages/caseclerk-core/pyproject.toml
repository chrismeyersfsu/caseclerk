[project]
name = "caseclerk-core"
version = "0.3.0"
description = "Config, database, discovery, and path-containment core for CaseClerk."
requires-python = ">=3.11"
authors = [{ name = "chrismeyersfsu" }]
dependencies = [
    "pydantic>=2.8",
    "platformdirs>=4.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseclerk_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
