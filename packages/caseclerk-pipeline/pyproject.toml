[project]
name = "caseclerk-pipeline"
version = "0.4.1"
description = "Document extraction, chunking, date detection, and processing queue for CaseClerk."
requires-python = ">=3.11"
authors = [{ name = "chrismeyersfsu" }]
dependencies = [
    "caseclerk-core",
    "mammoth>=1.8",
    "pdfminer.six>=20231228",
]

[tool.uv.sources]
caseclerk-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseclerk_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
