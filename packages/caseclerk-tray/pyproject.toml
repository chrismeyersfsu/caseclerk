[project]
name = "caseclerk-tray"
version = "0.5.0"
description = "Windows system-tray app for CaseClerk: status, settings, and startup-on-login."
requires-python = ">=3.11"
authors = [{ name = "chrismeyersfsu" }]
dependencies = [
    "caseclerk-core",
    "caseclerk-cli",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
caseclerk-tray = "caseclerk_tray.__main__:main"

[tool.uv.sources]
caseclerk-core = { workspace = true }
caseclerk-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseclerk_tray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
