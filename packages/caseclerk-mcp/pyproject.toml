[project]
name = "caseclerk-mcp"
version = "0.1.0"
description = "The CaseClerk MCP server: constrained case-file tools over stdio."
requires-python = ">=3.11"
authors = [{ name = "chrismeyersfsu" }]
dependencies = [
    "caseclerk-core",
    "caseclerk-pipeline",
    "caseclerk-artifacts",
    "mcp>=2.0",
]

[tool.uv.sources]
caseclerk-core = { workspace = true }
caseclerk-pipeline = { workspace = true }
caseclerk-artifacts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseclerk_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
