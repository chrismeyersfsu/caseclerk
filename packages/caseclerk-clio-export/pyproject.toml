[project]
name = "caseclerk-clio-export"
version = "0.5.0"
description = "Export contacts and matters from Clio Manage via the v4 REST API."
requires-python = ">=3.11"
authors = [{ name = "chrismeyersfsu" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
clio-export = "caseclerk_clio_export.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caseclerk_clio_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
